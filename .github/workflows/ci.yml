name: CI

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Lint (ruff)
        run: uv run ruff check src/fillxl/ tests/

      - name: Format check (ruff)
        run: uv run ruff format --check src/fillxl/ tests/

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Type check (mypy)
        run: uv run mypy src/fillxl/

      - name: Type check (pyrefly)
        run: uv run pyrefly check

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
        include:
          - os: windows-latest
            python-version: "3.11"
          - os: windows-latest
            python-version: "3.15"

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run tests
        run: uv run pytest tests/ -m "not xlwings and not win32com and not excel" --cov=fillxl --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          flags: unittests
          name: fillxl-coverage
          fail_ci_if_error: false

  # The test job above runs whatever `uv.lock` resolved.  This job pins the
  # oldest and the newest supported release line of each optional data backend,
  # so a new major (duckdb 2, polars 2) is exercised before users meet it.
  # `-k` matches markers as well as names, so every test that exercises the
  # backend runs whichever way it is spelled.
  backends:
    name: backends (${{ matrix.label }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: pandas-2
            pin: pandas>=2.0,<3
            select: pandas
          - label: polars-min
            pin: polars>=0.20,<1
            select: polars
          - label: polars-2
            pin: polars>=2,<3
            select: polars
          - label: duckdb-min
            pin: duckdb>=1.0,<2
            select: duckdb
          - label: duckdb-2
            pin: duckdb>=2,<3
            select: duckdb

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --all-extras

      # `uv run` would re-sync the lock file version back, hence --no-sync below.
      - name: Pin ${{ matrix.pin }}
        run: uv pip install "${{ matrix.pin }}"

      - name: Show the versions under test
        run: uv pip list | grep -E "^(pandas|polars|duckdb) "

      - name: Run backend tests
        run: >-
          uv run --no-sync pytest tests/
          -k "${{ matrix.select }} or validation"
          -m "not win32com and not xlwings"
          -q
